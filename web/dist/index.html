    <title>Pi Remote</title>
    <script>
      // 首帧前应用主题 class，避免暗色模式闪烁。
      (function () {
        try {
          var t = localStorage.getItem("pi-remote-theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
